<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Configure Laura Transcribe</title>
  <script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; color:#616161; text-align:center; padding:20px;">
  <div id="status">Setting up Laura Transcribe&hellip;</div>
  <script>
    // This app has no per-instance settings, so this page just points the
    // tab at the deployed content URL and saves immediately - no user
    // interaction required. Required because Teams' configurableTabs
    // (needed for meetingSidePanel / meetingStage contexts) always loads a
    // configurationUrl first; there's no way to skip straight to contentUrl
    // for meeting-scoped tabs.
    //
    // Every failure mode here is made VISIBLE in the panel itself, and falls
    // back to a direct navigation as a last resort - a silent hang or an
    // unexplained 404 elsewhere is exactly what made this hard to debug the
    // first time around.

    const statusEl = document.getElementById('status');
    const baseUrl = window.location.origin + window.location.pathname.replace(/config\.html$/, '');

    function showError(message) {
      statusEl.innerHTML = message + '<br/><br/><a href="' + baseUrl + '" target="_top" style="color:#6264A7;">Continue to Laura Transcribe &rarr;</a>';
    }

    function setConfigAndSave() {
      try {
        microsoftTeams.pages.config.setConfig({
          entityId: 'lauraTranscribe',
          contentUrl: baseUrl,
          websiteUrl: baseUrl,
          suggestedDisplayName: 'Laura Transcribe'
        });
        microsoftTeams.pages.config.setValidityState(true);
        microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
          saveEvent.notifySuccess();
        });
        statusEl.textContent = 'Ready.';
      } catch (err) {
        showError('Config step failed: ' + err.message);
      }
    }

    if (typeof microsoftTeams === 'undefined') {
      // The CDN script itself failed to load (network/CSP block) - this is
      // the most likely silent-failure point, since everything after this
      // depends on that global existing.
      showError('Teams SDK failed to load from CDN (network or content-security-policy block).');
    } else {
      const TIMEOUT_MS = 6000;
      let settled = false;

      const timeoutId = setTimeout(() => {
        if (!settled) {
          settled = true;
          showError('Teams initialization timed out.');
        }
      }, TIMEOUT_MS);

      microsoftTeams.app.initialize()
        .then(() => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          setConfigAndSave();
        })
        .catch((err) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeoutId);
          showError('Teams initialization failed: ' + (err && err.message ? err.message : err));
        });
    }
  </script>
</body>
</html>
